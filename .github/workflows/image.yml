# The platform image: built on every push, published once per VERSION, public so clusters pull it
# without a secret.
name: Image

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "twenty=${version%-olcrm.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # a published version never changes: clients pin it
      - name: Published already?
        id: published
        run: |
          if docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          # the clusters are amd64; arm64 under QEMU took most of the build, and hung it once
          platforms: linux/amd64
          build-args: TWENTY_VERSION=${{ steps.version.outputs.twenty }}
          push: ${{ github.ref == 'refs/heads/main' && steps.published.outputs.yes != 'true' }}
          provenance: false
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
